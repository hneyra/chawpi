server:
  port: 8093

spring:
  application:
    name: full-sample

chawpi:
  database:
    host: ${CHAWPI_DB_HOST:localhost}
    # no default on purpose: a PostGIS server (compose's postgres service, a tunnel, ...)
    port: ${CHAWPI_DB_PORT}
    # one database per sample: another sample's modules leave field types this one cannot read
    name: ${CHAWPI_DB_NAME:chawpi_full}
    username: ${CHAWPI_DB_USERNAME:chawpi}
    password: ${CHAWPI_DB_PASSWORD:chawpi}
  seed:
    # admin@chawpi.local / admin. a demo convenience: never on in a real deployment
    dev: ${CHAWPI_SEED_DEV:true}
  security:
    jwt:
      # sample only. a real deployment sets CHAWPI_JWT_SECRET (>= 32 bytes)
      secret: ${CHAWPI_JWT_SECRET:full-sample-only-secret-change-me-0123456789}
  automation:
    # the queue drain that runs automations. 0s turns it off
    poll-interval: ${CHAWPI_AUTOMATION_POLL:1s}
  gis:
    geoserver:
      # optional: docker compose -f infra/docker/compose.yml --profile gis up -d, then CHAWPI_GEOSERVER_ENABLED=true
      enabled: ${CHAWPI_GEOSERVER_ENABLED:false}
      url: ${CHAWPI_GEOSERVER_URL:http://localhost:8081/geoserver}
  # the assistant reads ANTHROPIC_API_KEY. without it the agent reports itself unavailable and nothing
  # else notices; chawpi.agent.enabled=false hides it altogether
