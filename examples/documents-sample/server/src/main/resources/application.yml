server:
  port: 8092

spring:
  application:
    name: documents-sample

chawpi:
  database:
    host: ${CHAWPI_DB_HOST:localhost}
    # no default on purpose: point it at your database (compose's postgres service, a tunnel, ...)
    port: ${CHAWPI_DB_PORT}
    # one database per sample: another sample's modules leave field types this one cannot read
    name: ${CHAWPI_DB_NAME:chawpi_documents}
    username: ${CHAWPI_DB_USERNAME:chawpi}
    password: ${CHAWPI_DB_PASSWORD:chawpi}
  seed:
    # admin@chawpi.local / admin. a demo convenience: never on in a real deployment
    dev: ${CHAWPI_SEED_DEV:true}
  security:
    jwt:
      # sample only. a real deployment sets CHAWPI_JWT_SECRET (>= 32 bytes)
      secret: ${CHAWPI_JWT_SECRET:documents-sample-only-secret-change-me-0123456789}
  automation:
    # the queue drain that runs automations (GENERATE_DOCUMENT included). 0s turns it off
    poll-interval: ${CHAWPI_AUTOMATION_POLL:1s}
